name: Clang format linter
# Triggers intentionally disabled for Argus-OSS-Security.
# on:
#   push: {}
#   pull_request: {}
# 
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: DoozyX/clang-format-lint-action@v0.20
      with:
        source: './src'
        extensions: 'java'
        clangFormatVersion: 16
